name: Dev Build

# 不在 push 时自动构建；如需试构建，可在 Actions 页使用 workflow_dispatch 手动触发。
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Wails CLI
        uses: actions/cache@v5
        id: wails-cache
        with:
          path: |
            .cache/wails-bin
            .cache/wails-gocache
          key: wails-v2.11.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            wails-v2.11.0-${{ runner.os }}-${{ runner.arch }}-
            wails-v2.11.0-${{ runner.os }}-

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/wails-bin .cache/wails-gocache
          GOCACHE="$PWD/.cache/wails-gocache" GOBIN="$PWD/.cache/wails-bin" go install -trimpath github.com/wailsapp/wails/v2/cmd/wails

      - name: Configure Wails PATH
        shell: bash
        run: echo "$PWD/.cache/wails-bin" >> "$GITHUB_PATH"

      - name: Regenerate bindings and build dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/dist
          printf '<!doctype html><title>PinkHunkReader</title>\n' > frontend/dist/index.html
          wails generate module
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Pack frontend dist
        shell: bash
        run: tar -cf frontend-dist.tar -C frontend/dist .

      - name: Upload frontend dist
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend-dist.tar
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.platform }}
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            os_name: Windows
            arch_name: Amd64
            build_name: pinkhunkreader-dev-windows-amd64
          - os: macos-latest
            platform: darwin/arm64
            os_name: MacOS
            arch_name: Arm64
            build_name: pinkhunkreader-dev-darwin-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download frontend dist
        uses: actions/download-artifact@v6
        with:
          name: frontend-dist
          path: frontend-artifact

      - name: Extract frontend dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frontend/dist
          test -s frontend-artifact/frontend-dist.tar
          tar -xf frontend-artifact/frontend-dist.tar -C frontend/dist
          test -s frontend/dist/index.html

      - name: Cache Wails CLI
        uses: actions/cache@v5
        id: wails-cache
        with:
          path: |
            .cache/wails-bin
            .cache/wails-gocache
          key: wails-v2.11.0-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            wails-v2.11.0-${{ runner.os }}-${{ runner.arch }}-
            wails-v2.11.0-${{ runner.os }}-

      - name: Install Wails
        if: steps.wails-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/wails-bin .cache/wails-gocache
          GOCACHE="$PWD/.cache/wails-gocache" GOBIN="$PWD/.cache/wails-bin" go install -trimpath github.com/wailsapp/wails/v2/cmd/wails

      - name: Configure Wails PATH
        shell: bash
        run: echo "$PWD/.cache/wails-bin" >> "$GITHUB_PATH"

      - name: Generate dev version
        id: version
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=dev-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euo pipefail
          wails build -s -skipbindings -platform ${{ matrix.platform }} -clean -o ${{ matrix.build_name }} -ldflags "-s -w"

      - name: Package Windows EXE
        if: startsWith(matrix.platform, 'windows/')
        shell: pwsh
        run: |
          Set-Location build/bin
          $version = "${{ steps.version.outputs.version }}"
          $target = "${{ matrix.build_name }}"
          $finalExeName = "PinkHunkReader-$version-${{ matrix.os_name }}-${{ matrix.arch_name }}.exe"
          if (Test-Path "$target.exe") {
              Copy-Item -LiteralPath "$target.exe" -Destination "..\\..\\$finalExeName" -Force
          } elseif (Test-Path "$target") {
              Copy-Item -LiteralPath "$target" -Destination "..\\..\\$finalExeName" -Force
          } else {
              Write-Error "Build output not found"
              exit 1
          }
          Write-Host "Output $finalExeName"

      - name: Package macOS DMG
        if: startsWith(matrix.platform, 'darwin/')
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg
          VERSION="${{ steps.version.outputs.version }}"
          cd build/bin
          ls -la
          APP_PATH=$(find . -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found"
            exit 1
          fi
          APP_NAME=$(basename "$APP_PATH")
          if command -v xattr >/dev/null 2>&1; then
            xattr -cr "$APP_NAME" || true
          fi
          codesign --force --deep --sign - "$APP_NAME"
          DMG_NAME="${{ matrix.build_name }}.dmg"
          FINAL_NAME="PinkHunkReader-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch_name }}.dmg"
          set +e
          create-dmg \
            --volname "PinkHunkReader" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "$APP_NAME" 200 190 \
            --hide-extension "$APP_NAME" \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$APP_NAME"
          set -e
          if [ -f "$DMG_NAME" ]; then
            mv "$DMG_NAME" "../../$FINAL_NAME"
          else
            FINAL_NAME="PinkHunkReader-${VERSION}-${{ matrix.os_name }}-${{ matrix.arch_name }}.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP_NAME" "../../$FINAL_NAME"
          fi
          echo "Output $FINAL_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: pinkhunkreader-dev-${{ matrix.os_name }}-${{ matrix.arch_name }}
          path: |
            PinkHunkReader-*.exe
            PinkHunkReader-*.dmg
            PinkHunkReader-*.zip
          if-no-files-found: error
          retention-days: 7
