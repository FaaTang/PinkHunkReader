<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg"/>
    <title>PinkHunkReader</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('pinkhunk-reader.theme');
          var prefs = raw ? JSON.parse(raw) : null;
          var mode = prefs && (prefs.mode === 'light' || prefs.mode === 'dark' || prefs.mode === 'system')
            ? prefs.mode
            : 'system';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* ignore */ }
        try {
          var rawLang = localStorage.getItem('pinkhunk-reader.language') || 'system';
          var prefersZh = rawLang === 'zh' || (rawLang === 'system' && (navigator.languages || [navigator.language]).some(function (tag) {
            return /^zh(-|$)/i.test(tag);
          }));
          document.documentElement.lang = prefersZh ? 'zh-CN' : 'en';
          document.documentElement.setAttribute('data-lang', prefersZh ? 'zh' : 'en');
        } catch (e) { /* ignore */ }
      })();
    </script>
</head>
<body>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
